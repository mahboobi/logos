[scaffold]
version = "0.2.0"

[repos.lez]
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
pin = "cf3639d8252040d13b3d4e933feb19b42c76e14a"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "73fc462eb8f0a4d00f1a846437c627ec2e523f83"

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp.git"
pin = "bbe5da0e038ef19095690f4164a8ddaab0915821"
build = "nix-flake"
attr = "app"

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
pin = "d3af2972f51d9c542537d80d60ad8d20282ddcd1"
build = "nix-flake"
attr = "cli"

[modules.delivery_module]
flake = "github:logos-co/logos-delivery-module/1d995bda3128e13f21ed17e0f925f4c04d2bd117#lgx"
role = "dependency"

# delivery_module declares these two as OPTIONAL dependencies, and scaffold
# skips optional deps with a note — so neither was installed. The cost is
# not cosmetic: without RLN, delivery logs "sends and proof validation fail
# until it does", which is exactly the publish path Phase 0 task 4 and the
# two-profile test depend on. Revs are delivery_module's own locked inputs,
# so they are the versions it was built against.
[modules.liblogos_rln_module]
flake = "git+https://github.com/logos-co/logos-rln-modules?dir=logos-rln-module&rev=a814e7feda974a16eaa5dd50667b8fd843177f0e#lgx"
role = "dependency"

[modules.libp2p_module]
flake = "git+https://github.com/logos-co/logos-libp2p-module?rev=33e3c7a7c57f5c190781d0910a520742a4822e5f#lgx"
role = "dependency"

[modules.olb_core]
flake = "path:./olb_core#lgx"
role = "project"

[modules.olb_ui]
flake = "path:./olb_ui#lgx"
role = "project"

[modules.storage_module]
flake = "github:logos-co/logos-storage-module/59b494e411b31797d029c0edb7e243198e13e771#lgx"
role = "dependency"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "lez-framework"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.4.1"
